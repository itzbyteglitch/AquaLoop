<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <!-- Deep ocean to teal gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1d3b"/>
      <stop offset="35%" stop-color="#0e3a5c"/>
      <stop offset="70%" stop-color="#0a4d5e"/>
      <stop offset="100%" stop-color="#065f6b"/>
    </linearGradient>
    <!-- Water surface highlight -->
    <linearGradient id="waterHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Droplet gradient -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <!-- Accent ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Soft shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#waterHighlight)"/>

  <!-- Subtle geometric pattern (water ripple lines) -->
  <g opacity="0.04" stroke="#22d3ee" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- Center content group -->
  <g transform="translate(600 200)">
    <!-- Outer ring (animated loop suggestion) -->
    <circle r="135" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.35" filter="url(#glow)"/>
    <!-- Middle ring -->
    <circle r="110" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.2" stroke-dasharray="12 12"/>
    <!-- Inner ring -->
    <circle r="85" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.15" stroke-dasharray="8 16"/>

    <!-- Droplet icon -->
    <g filter="url(#shadow)">
      <path d="M0 -85 C0 -85 -65 15 -65 75 a65 65 0 0 0 130 0 C65 15 0 -85 0 -85 Z" fill="url(#dropGrad)"/>
      <!-- Droplet highlight -->
      <path d="M-15 -40 C-15 -40 -10 -5 -10 25 a20 20 0 0 0 40 0 C30 -5 15 -40 15 -40 Z" fill="#ffffff" opacity="0.25"/>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="435" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="-1.5">AquaLoop</text>

  <!-- Tagline -->
  <text x="600" y="495" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="400" fill="#a5f3fc" letter-spacing="0.5">Smart Water Today, Sustainable Tomorrow</text>

  <!-- Divider line -->
  <g transform="translate(600 535)">
    <line x1="-100" y1="0" x2="100" y2="0" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <circle cx="0" cy="0" r="4" fill="#06b6d4"/>
    <line x1="-40" y1="0" x2="-20" y2="0" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="0" x2="40" y2="0" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Bottom accent bars (water level indicators) -->
  <g transform="translate(600 575)" fill="#22d3ee" opacity="0.6">
    <rect x="-200" y="0" width="48" height="6" rx="3"/>
    <rect x="-120" y="0" width="48" height="6" rx="3" opacity="0.7"/>
    <rect x="-40" y="0" width="48" height="6" rx="3"/>
    <rect x="40" y="0" width="48" height="6" rx="3" opacity="0.7"/>
    <rect x="120" y="0" width="48" height="6" rx="3"/>
  </g>
</svg>